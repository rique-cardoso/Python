<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Sistema de autenticação{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block estilos %}{% endblock %}
</head>
<body>
    <header class="cabecalho">
    <div class="cabecalho-conteudo">
        <h1 class="logo">Sistema de autenticação</h1>

        <nav class="menu">
            <a href="{{ url_for('pagina_inicial') }}">Início</a>
            <a href="{{ url_for('sobre') }}">Sobre</a>
            <a href="{{ url_for('login') }}">Entrar</a>
            <a href="{{ url_for('cadastro')}}">Criar conta</a>
        </nav>
    </div>
</header>

<main class="conteudo">
    {% block conteudo %}
    {% endblock %}
</main>

<footer class="rodape">
    <p>Projeto de estudo com Flask</p>
</footer>
    {% block scripts %} {% endblock %}
</body>
</html>
