{% extends "base.html" %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}
    <section class="formulario-container">
        <h2>Entrar</h2>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    value="{{ email or ''}}"
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >
            </div>

            <button type="submit">Entrar</button>
        </form>
    </section>
    <p>Ainda não possui uma conta? <a href="{{url_for('cadastro')}}">Cadastre-se</a></p>
    {% if mensagem %}
        <p class="mensagem">{{ mensagem }}</p>
    {% endif %}
{% endblock %}
